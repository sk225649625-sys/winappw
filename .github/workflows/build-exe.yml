name: Build ReelForge.exe (C++)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.*"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2019_64"

      - name: Configure (CMake)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Deploy Qt DLLs next to the exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build\Release\ReelForge.exe dist\
          & "$env:Qt6_DIR\..\..\bin\windeployqt.exe" dist\ReelForge.exe --release --no-translations

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath ReelForge-windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReelForge-windows
          path: ReelForge-windows.zip

      - name: Create GitHub Release (tag push par)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ReelForge-windows.zip
